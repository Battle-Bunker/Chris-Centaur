<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Snek Bot Configuration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .content {
            padding: 30px;
        }
        
        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .config-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #dee2e6;
        }
        
        .config-section h3 {
            color: #495057;
            margin-bottom: 15px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
        }
        
        .config-section h3 span {
            margin-right: 8px;
        }
        
        .config-item {
            margin-bottom: 15px;
        }
        
        .config-item label {
            display: block;
            margin-bottom: 5px;
            color: #6c757d;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .config-item .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .config-item input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #dee2e6;
            outline: none;
            -webkit-appearance: none;
        }
        
        .config-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }
        
        .config-item input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }
        
        .config-item input[type="number"] {
            width: 80px;
            padding: 5px 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 0.9rem;
            text-align: center;
        }
        
        .config-item .description {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 5px;
            line-height: 1.4;
        }
        
        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c82333;
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐍 Team Snek Bot Configuration</h1>
            <p>Fine-tune the centaur's decision-making heuristics</p>
        </div>
        
        <div class="content">
            <div id="alertContainer"></div>
            
            <div class="loading active" id="loadingIndicator">
                <div class="spinner"></div>
                <p>Loading configuration...</p>
            </div>
            
            <div id="configContainer" style="display: none;">
                <!-- Sections and sliders are generated from the /api/config
                     response's `ui` metadata (see renderConfigUi below): the
                     server's heuristic registry is the single source of truth
                     for keys, ranges and copy. -->
                <div class="config-grid" id="configGrid"></div>
            </div>
        </div>
        
        <div class="actions">
            <button class="btn btn-primary" onclick="saveConfig()">💾 Save Configuration</button>
            <button class="btn btn-secondary" onclick="loadConfig()">🔄 Reload</button>
            <button class="btn btn-danger" onclick="resetConfig()">⚠️ Reset to Defaults</button>
        </div>
    </div>

    <script>
        let currentConfig = {};
        let defaults = {};

        // Config keys by kind, learned from the server's `ui` metadata when the
        // sections are rendered — nothing here hand-lists heuristic names.
        let numericKeys = [];
        let booleanKeys = [];

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            loadConfig();
        });

        // Build the section cards and their controls from the server-provided
        // UI metadata (the heuristic registry + the non-heuristic settings).
        function renderConfigUi(sections) {
            const grid = document.getElementById('configGrid');
            grid.innerHTML = '';
            numericKeys = [];
            booleanKeys = [];

            for (const section of sections) {
                const sectionEl = document.createElement('div');
                sectionEl.className = 'config-section';

                const heading = document.createElement('h3');
                const emoji = document.createElement('span');
                emoji.textContent = section.emoji;
                heading.appendChild(emoji);
                heading.appendChild(document.createTextNode(section.title));
                sectionEl.appendChild(heading);

                for (const item of section.items) {
                    if (item.type === 'boolean') {
                        booleanKeys.push(item.key);
                        sectionEl.appendChild(renderBooleanItem(item));
                    } else {
                        numericKeys.push(item.key);
                        sectionEl.appendChild(renderNumberItem(item));
                    }
                }
                grid.appendChild(sectionEl);
            }
        }

        // One slider + number input pair with two-way binding.
        function renderNumberItem(item) {
            const wrap = document.createElement('div');
            wrap.className = 'config-item';

            const label = document.createElement('label');
            label.htmlFor = item.key;
            label.textContent = item.label;
            wrap.appendChild(label);

            const group = document.createElement('div');
            group.className = 'input-group';
            const slider = document.createElement('input');
            slider.type = 'range';
            slider.id = `${item.key}_slider`;
            const input = document.createElement('input');
            input.type = 'number';
            input.id = item.key;
            for (const el of [slider, input]) {
                el.min = item.range.min;
                el.max = item.range.max;
                el.step = item.range.step;
            }
            slider.addEventListener('input', () => { input.value = slider.value; });
            input.addEventListener('input', () => { slider.value = input.value; });
            group.appendChild(slider);
            group.appendChild(input);
            wrap.appendChild(group);

            const desc = document.createElement('div');
            desc.className = 'description';
            desc.textContent = item.description;
            wrap.appendChild(desc);
            return wrap;
        }

        // A single checkbox row (e.g. autoFirstMove).
        function renderBooleanItem(item) {
            const wrap = document.createElement('div');
            wrap.className = 'config-item';

            const label = document.createElement('label');
            label.htmlFor = item.key;
            label.textContent = item.label;
            wrap.appendChild(label);

            const group = document.createElement('div');
            group.className = 'input-group';
            group.style.justifyContent = 'flex-start';
            const boxLabel = document.createElement('label');
            boxLabel.style.cssText = 'display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 1rem; color: #333;';
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = item.key;
            checkbox.style.cssText = 'width: 20px; height: 20px; cursor: pointer;';
            const span = document.createElement('span');
            span.textContent = item.checkboxLabel || item.label;
            boxLabel.appendChild(checkbox);
            boxLabel.appendChild(span);
            group.appendChild(boxLabel);
            wrap.appendChild(group);

            const desc = document.createElement('div');
            desc.className = 'description';
            desc.textContent = item.description;
            wrap.appendChild(desc);
            return wrap;
        }

        // Load configuration from API
        async function loadConfig() {
            try {
                showLoading(true);
                hideAlert();
                
                const response = await fetch('/api/config');
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load configuration');
                }
                
                currentConfig = data.config;
                defaults = data.defaults;

                // (Re)build the sections/sliders from the server's registry-
                // derived UI metadata (ranges included), then fill in values.
                renderConfigUi(data.ui || []);

                numericKeys.forEach(key => {
                    const value = currentConfig[key];
                    const slider = document.getElementById(`${key}_slider`);
                    const input = document.getElementById(key);
                    if (slider && input && value !== undefined) {
                        slider.value = value;
                        input.value = value;
                    }
                });

                booleanKeys.forEach(key => {
                    const checkbox = document.getElementById(key);
                    if (checkbox && currentConfig[key] !== undefined) {
                        checkbox.checked = currentConfig[key];
                    }
                });

                document.getElementById('configContainer').style.display = 'block';
                showAlert('Configuration loaded successfully', 'info');
            } catch (error) {
                console.error('Error loading config:', error);
                showAlert(`Error loading configuration: ${error.message}`, 'error');
            } finally {
                showLoading(false);
            }
        }
        
        // Save configuration to API
        async function saveConfig() {
            try {
                showLoading(true);
                hideAlert();
                
                // Collect all values
                const updates = {};
                numericKeys.forEach(key => {
                    const input = document.getElementById(key);
                    if (input) {
                        updates[key] = parseFloat(input.value);
                    }
                });
                booleanKeys.forEach(key => {
                    const checkbox = document.getElementById(key);
                    if (checkbox) {
                        updates[key] = checkbox.checked;
                    }
                });
                
                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(updates)
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to save configuration');
                }
                
                currentConfig = data.config;
                showAlert('Configuration saved successfully! Changes will take effect on next move.', 'success');
            } catch (error) {
                console.error('Error saving config:', error);
                showAlert(`Error saving configuration: ${error.message}`, 'error');
            } finally {
                showLoading(false);
            }
        }
        
        // Reset configuration to defaults
        async function resetConfig() {
            if (!confirm('Are you sure you want to reset all settings to defaults?')) {
                return;
            }
            
            try {
                showLoading(true);
                hideAlert();
                
                const response = await fetch('/api/config', {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to reset configuration');
                }
                
                // Reload to show defaults
                await loadConfig();
                showAlert('Configuration reset to defaults', 'success');
            } catch (error) {
                console.error('Error resetting config:', error);
                showAlert(`Error resetting configuration: ${error.message}`, 'error');
            } finally {
                showLoading(false);
            }
        }
        
        // UI helper functions
        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `
                <div class="alert alert-${type}">
                    ${message}
                </div>
            `;
            
            // Auto-hide info alerts after 3 seconds
            if (type === 'info') {
                setTimeout(hideAlert, 3000);
            }
        }
        
        function hideAlert() {
            document.getElementById('alertContainer').innerHTML = '';
        }
        
        function showLoading(show) {
            const loading = document.getElementById('loadingIndicator');
            if (show) {
                loading.classList.add('active');
            } else {
                loading.classList.remove('active');
            }
        }
    </script>
<script src="/firebase-status-banner.js"></script>
</body>
</html>
