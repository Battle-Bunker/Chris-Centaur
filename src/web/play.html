<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centaur Play - Active Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: #1a1a1a;
      color: #e0e0e0;
      padding-top: 60px;
    }
    .header {
      position: fixed; top: 0; left: 0; right: 0; height: 60px;
      background: #2a2a2a; border-bottom: 1px solid #444;
      display: flex; align-items: center; justify-content: center;
      padding: 0 15px; z-index: 1000;
    }
    .header h1 { font-size: 20px; font-weight: 600; }
    .nav-links { position: absolute; right: 15px; display: flex; gap: 10px; }
    .nav-links a {
      color: #4CAF50; text-decoration: none; font-size: 14px;
      padding: 6px 12px; border-radius: 4px; background: #333;
    }
    .nav-links a:hover { background: #444; }
    .main-content {
      max-width: 1200px; margin: 0 auto; padding: 20px 15px;
    }
    .status-bar {
      background: #2a2a2a; border-radius: 8px; padding: 15px;
      margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
    }
    .status-text { font-size: 14px; color: #888; }
    .ws-status {
      font-size: 11px; padding: 3px 8px; border-radius: 10px;
      font-weight: 600;
    }
    .ws-status.connected { background: #2e7d32; color: #c8e6c9; }
    .ws-status.disconnected { background: #c62828; color: #ffcdd2; }
    .ws-status.connecting { background: #e65100; color: #ffe0b2; }
    .no-games {
      text-align: center; padding: 60px 20px; color: #666;
    }
    .no-games h2 { font-size: 24px; margin-bottom: 10px; }
    .no-games p { font-size: 14px; line-height: 1.6; }
    .game-card {
      background: #2a2a2a; border-radius: 8px; padding: 15px;
      border: 1px solid #444; cursor: pointer; transition: all 0.2s;
      margin-bottom: 15px; display: flex; gap: 15px; align-items: stretch;
    }
    .game-card:hover { border-color: #4CAF50; transform: translateY(-2px); }
    /* Pending lobby: invited but not started. Not clickable — there is no
       game page until the game starts. */
    .game-card.pending { border: 2px solid #FF9800; cursor: default; }
    .game-card.pending:hover { border-color: #FF9800; transform: none; }
    .pending-badge {
      font-size: 11px; font-weight: 700; color: #FF9800;
      border: 1px solid #FF9800; border-radius: 10px; padding: 2px 8px;
    }
    .game-card-settings { font-size: 12px; color: #888; margin-bottom: 8px; }
    .team-dot {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      border: 1px solid #555;
    }
    .game-card-info { flex: 1; min-width: 0; }
    .game-card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .game-card-id {
      font-size: 11px; color: #666; word-break: break-all;
      margin-bottom: 8px;
    }
    .game-card-time {
      font-size: 12px; color: #4CAF50; white-space: nowrap;
    }
    .game-card-turn { font-size: 12px; color: #888; }
    .game-card-snakes {
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .controlled-snake-tag {
      display: inline-flex; align-items: center; gap: 4px;
      background: #333; padding: 4px 10px; border-radius: 12px;
      font-size: 13px; border: 1px solid #555;
    }
    .our-team-tag { border-color: #4caf50; }
    .us-badge {
      background: #4caf50; color: #08130a; font-weight: 700;
      font-size: 10px; padding: 1px 5px; border-radius: 8px; letter-spacing: 0.5px;
    }
    .our-centaur-line {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: #bbb; margin: 4px 0;
    }
    .our-centaur-line strong { color: #fff; }
    .game-card-minimap {
      width: 150px; min-width: 150px; flex-shrink: 0;
    }
    .game-card-canvas {
      width: 100%; aspect-ratio: 1; border: 1px solid #444;
      border-radius: 4px; background: #ffffff;
    }
    .engine-link {
      font-size: 11px; color: #4CAF50; text-decoration: none;
      white-space: nowrap;
    }
    .engine-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Centaur Play</h1>
    <div class="nav-links">
      <a href="/history">History</a>
      <a href="/config">Config</a>
    </div>
  </div>

  <div class="main-content">
    <div class="status-bar">
      <span class="status-text" id="statusText">Connecting...</span>
      <span class="ws-status connecting" id="wsStatus">Connecting</span>
    </div>

    <div id="gameContainer">
      <div class="no-games">
        <h2>Connecting...</h2>
        <p>Waiting for WebSocket connection to server.</p>
      </div>
    </div>
  </div>

  <script src="/dom-utils.js"></script>
  <script src="/board-renderer.js"></script>
  <script src="/idle-policy.js"></script>
  <script src="/server-status-badge.js"></script>
  <script src="/firebase-status-banner.js"></script>
  <script src="/idle-watcher.js"></script>
  <script src="/connection-debug.js"></script>
  <script>
    let ws = null;
    let reconnectTimer = null;
    let currentGames = [];
    let currentPendingGames = [];
    let engineHost = null; // GAME_ENGINE_HOST from the server; null = no links
    const wsDebug = window.ConnectionDebugger.attach({});
    const idleWatcher = window.IdleWatcher.attach({
      getWS: () => ws,
      reconnect: () => connectWebSocket(),
    });

    function connectWebSocket() {
      const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${wsProtocol}//${location.host}/ws`;

      const statusEl = document.getElementById('wsStatus');
      statusEl.textContent = 'Connecting';
      statusEl.className = 'ws-status connecting';

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusEl.textContent = 'Connected';
        statusEl.className = 'ws-status connected';
        ws.send(JSON.stringify({ type: 'subscribe-lobby' }));
        if (reconnectTimer) {
          clearInterval(reconnectTimer);
          reconnectTimer = null;
        }
        wsDebug.onOpen();
        idleWatcher.onConnected();
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'debug-hello') {
            wsDebug.setServerConnId(msg.connId);
          } else if (msg.type === 'lobby-update') {
            currentGames = msg.games;
            currentPendingGames = msg.pendingGames || [];
            engineHost = msg.engineHost || null;
            renderGames(currentGames);
          } else if (msg.type === 'firebase-status') {
            window.FirebaseStatusBanner?.set(msg.status);
          }
        } catch (e) {
          console.error('WS message parse error:', e);
        }
      };

      ws.onclose = (event) => {
        statusEl.textContent = 'Disconnected';
        statusEl.className = 'ws-status disconnected';
        wsDebug.onClose(event);
        const wasIdle = idleWatcher.onClose(event);
        if (wasIdle) {
          // Surface the idle close in the connection log as its own event
          // so /connection-debug clearly distinguishes "user went idle" from
          // a network blip or page navigation.
          fetch('/api/connection-log/client', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              type: 'client-idle-close',
              code: event.code,
              reason: event.reason || '',
            }),
          }).catch(() => {});
          return;
        }
        if (idleWatcher.shouldSuppressReconnect()) return;
        scheduleReconnect();
      };

      ws.onerror = (event) => {
        statusEl.textContent = 'Error';
        statusEl.className = 'ws-status disconnected';
        wsDebug.onError(event);
      };
    }

    function scheduleReconnect() {
      if (!reconnectTimer) {
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          wsDebug.onReconnectAttempt();
          connectWebSocket();
        }, 2000);
      }
    }

    // No client-side liveness filtering: the server's game list is now kept
    // honest at the source (deleted/ended games are removed the moment the
    // Firebase listener observes them, with the server's idle sweep as the
    // crash backstop), so the lobby renders exactly what the server reports.
    // The old 2-minute turn-activity filter here was a second, independent
    // staleness heuristic layered on top and made cards blink out and back.

    function formatStartTime(ts) {
      if (!ts) return '';
      return 'Started ' + new Intl.DateTimeFormat(undefined, {
        month: 'short', day: 'numeric',
        hour: 'numeric', minute: '2-digit'
      }).format(new Date(ts));
    }

    // Link to the game on the team snek engine server. Empty string when the
    // host isn't configured or the session/game IDs aren't known. stopPropagation
    // keeps the click from also triggering the card's own click handler.
    function engineLink(sessionID, gameID) {
      if (!engineHost || !sessionID || !gameID) return '';
      const url = `https://${engineHost}/session/${encodeURIComponent(sessionID)}/${encodeURIComponent(gameID)}`;
      return `<a class="engine-link" href="${url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">View on engine ↗</a>`;
    }

    // Firebase-provided team data is untrusted: escape names (escapeHtml from
    // dom-utils.js) before innerHTML interpolation and only pass through
    // colors that look like plain CSS color tokens (hex / rgb()/hsl() / simple
    // keyword) so nothing can break out of the style attribute.
    function safeColor(c) {
      return typeof c === 'string' && /^(#[0-9a-fA-F]{3,8}|[a-zA-Z]+|rgba?\([\d\s.,%]+\)|hsla?\([\d\s.,%]+\))$/.test(c.trim())
        ? c.trim() : '#888';
    }

    // Pending lobby bubble: the centaur has been invited but the game hasn't
    // started. Identified by sessionID+gameID; deliberately NOT clickable.
    function renderPendingCard(pg) {
      const board = pg.boardWidth && pg.boardHeight ? `${pg.boardWidth}×${pg.boardHeight}` : '?';
      const teams = pg.teams || [];
      const teamTags = teams.map(t =>
        `<span class="controlled-snake-tag${t.ours ? ' our-team-tag' : ''}"><span class="team-dot" style="background:${safeColor(t.color)}"></span>${escapeHtml(t.name)}${t.ours ? ' <span class="us-badge">US</span>' : ''}</span>`
      ).join('');
      const ourTeam = teams.find(t => t.ours);
      const ourLine = ourTeam
        ? `<div class="our-centaur-line"><span class="team-dot" style="background:${safeColor(ourTeam.color)}"></span>Playing as <strong>${escapeHtml(ourTeam.name)}</strong></div>`
        : '';
      return `
        <div class="game-card pending">
          <div class="game-card-info">
            <div class="game-card-header">
              <span class="pending-badge">PENDING</span>
              <span class="game-card-turn">${teams.length} team${teams.length === 1 ? '' : 's'}</span>
            </div>
            <div class="game-card-id">${pg.sessionID} / ${pg.gameID} ${engineLink(pg.sessionID, pg.gameID)}</div>
            <div class="game-card-settings">
              Board ${board} · ${pg.snakesPerTeam ?? '?'} snakes/team · ${pg.maxTurnTime ?? '?'}s turns
            </div>
            ${ourLine}
            <div class="game-card-snakes">${teamTags}</div>
          </div>
        </div>`;
    }

    function renderGames(games) {
      const container = document.getElementById('gameContainer');
      const statusText = document.getElementById('statusText');
      const pending = currentPendingGames;

      if (games.length === 0 && pending.length === 0) {
        container.innerHTML = `
          <div class="no-games">
            <h2>No Active Games</h2>
            <p>Start a game on the Battlesnake platform to see it here.<br>
            Games will appear automatically when the bot receives move requests.</p>
          </div>`;
        statusText.textContent = 'No active games';
        return;
      }

      const parts = [];
      if (games.length > 0) parts.push(`${games.length} active game${games.length > 1 ? 's' : ''}`);
      if (pending.length > 0) parts.push(`${pending.length} pending`);
      statusText.textContent = parts.join(' · ') || 'No active games';

      const sorted = [...games].sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0));

      let html = '';
      for (const pg of pending) {
        html += renderPendingCard(pg);
      }
      for (const game of sorted) {
        const startLabel = formatStartTime(game.startedAt);
        const snakeTags = (game.controlledSnakes || []).map(s =>
          `<span class="controlled-snake-tag">${escapeHtml(s.name || 'Snake')}</span>`
        ).join('');
        const ourActiveLine = game.ourTeam
          ? `<div class="our-centaur-line"><span class="team-dot" style="background:${safeColor(game.ourTeam.color)}"></span>Playing as <strong>${escapeHtml(game.ourTeam.name)}</strong></div>`
          : '';

        html += `
        <div class="game-card" onclick="openGame('${game.gameId}')">
          <div class="game-card-info">
            <div class="game-card-header">
              <span class="game-card-turn">Turn ${game.turn}</span>
              ${startLabel ? `<span class="game-card-time">${startLabel}</span>` : ''}
            </div>
            <div class="game-card-id">${game.gameId} ${engineLink(game.sessionId, game.gameId)}</div>
            ${ourActiveLine}
            <div class="game-card-snakes">${snakeTags}</div>
          </div>
          <div class="game-card-minimap">
            <canvas class="game-card-canvas" id="minimap-${game.gameId}" width="200" height="200"></canvas>
          </div>
        </div>`;
      }
      container.innerHTML = html;

      requestAnimationFrame(() => {
        sorted.forEach(game => {
          if (game.gameState) {
            const canvas = document.getElementById(`minimap-${game.gameId}`);
            if (canvas) {
              canvas.width = canvas.clientWidth;
              canvas.height = canvas.clientHeight;
              const ourIds = (game.controlledSnakes || []).map(s => s.id);
              BoardRenderer.renderMinimap(canvas, game.gameState, ourIds);
            }
          }
        });
      });
    }

    connectWebSocket();
  </script>
</body>
</html>
