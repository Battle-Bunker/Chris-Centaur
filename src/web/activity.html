<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Activity</title>
  <link rel="stylesheet" href="/chrome.css">
  <style>
    /* The page answers "what did the bot do while I was away". It used to draw
       the answer and then report "16 events"; now it states it and draws it.
       See docs/design/ux/04-SECONDARY-SCREENS.md §1 F4. */

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      background: var(--panel); border: 1px solid var(--line-soft);
      border-radius: 8px; padding: 10px 14px; margin-bottom: 12px;
    }
    .toolbar button {
      background: #333; color: var(--ink); border: 1px solid #4a4a4a;
      border-radius: 4px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer;
    }
    .toolbar button:hover { border-color: #6a6a6a; background: #3d3d3d; }
    .toolbar button.active {
      background: #24402a; color: #d6efd7; border-color: #3c6e3e;
      box-shadow: inset 0 -2px 0 0 var(--go);
    }
    .toolbar .spacer { flex: 1; }
    .status-text { font-size: 13px; color: var(--ink-dim); }

    /* ── The reading ────────────────────────────────────────────────────── */
    .summary {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1px; background: var(--line-soft);
      border: 1px solid var(--line-soft); border-radius: 8px;
      overflow: hidden; margin-bottom: 12px;
    }
    .stat { background: var(--panel); padding: 11px 14px; }
    .stat .k {
      font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--ink-faint); margin-bottom: 3px;
    }
    .stat .v {
      font-size: 19px; font-weight: 700; color: #fff; line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }
    .stat .n { font-size: 11.5px; color: var(--ink-dim); margin-top: 3px; }
    .stat.warn .v { color: #f4e3c4; }
    .stat.bad  .v { color: #f7d6c8; }
    /* The share bar is the one place a proportion is worth drawing: idle is
       the billed waste this page exists to expose. */
    .share { height: 5px; border-radius: 3px; background: #3a3a3a; margin-top: 7px; overflow: hidden; display: flex; }
    .share i { display: block; height: 100%; }

    .chart-wrap {
      background: var(--panel-2); border: 1px solid var(--line);
      border-radius: 8px; position: relative;
    }
    /* The chart is the page; it takes the room the page has. It was a fixed
       260 px band in a 900 px viewport with ~45 % of the screen left empty
       (04-SECONDARY-SCREENS F4), and every band and marker was drawn smaller
       than it needed to be. Bounded at both ends so it stays a timeline on a
       laptop and does not become a wall on a monitor; `window.resize` already
       redraws. */
    #chart {
      display: block; width: 100%; cursor: grab; touch-action: none;
      height: clamp(300px, calc(100vh - 340px), 620px);
    }
    #chart.dragging { cursor: grabbing; }
    #chart:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; border-radius: 8px; }
    /* Fixed, not absolute-inside-an-overflow-hidden-box: the old tooltip was
       clipped near the lower edge of the chart. */
    #tooltip {
      position: fixed; pointer-events: none; display: none;
      background: #111; border: 1px solid #666; border-radius: 6px;
      padding: 8px 10px; font-size: 12px; line-height: 1.5; max-width: 340px;
      z-index: 10500; white-space: pre-wrap; word-break: break-word;
      box-shadow: 0 6px 24px rgba(0,0,0,0.6); color: var(--ink);
    }
    .hint { font-size: 12px; color: var(--ink-faint); margin-top: 8px; }
    .hint kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #333; border: 1px solid #555; border-radius: 3px;
      padding: 0 4px; font-size: 11px; color: #ddd;
    }
    #detailPanel {
      margin-top: 12px; background: var(--panel); border: 1px solid var(--line-soft);
      border-radius: 8px; padding: 12px 15px;
      font-size: 13px; line-height: 1.6; display: none; word-break: break-word;
    }
    #detailPanel h3 { font-size: 14px; margin-bottom: 4px; }
    #detailPanel pre {
      background: #171717; border-radius: 4px; padding: 8px; margin-top: 6px;
      font-size: 12px; overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="header"><h1>Activity</h1></div>

  <div class="main-content">
    <div class="toolbar">
      <button data-range="3600000">1h</button>
      <button data-range="21600000">6h</button>
      <button data-range="86400000">24h</button>
      <button data-range="259200000">3d</button>
      <button data-range="604800000" class="active">7d</button>
      <button data-range="2592000000">30d</button>
      <button id="refreshBtn" title="Reload events for the current view (r)">Refresh</button>
      <div class="spacer"></div>
      <span class="status-text" id="statusText">Loading…</span>
    </div>

    <div class="summary" id="summary" aria-live="polite"></div>

    <div class="chart-wrap">
      <canvas id="chart" tabindex="0" role="img"
              aria-label="Server activity timeline. Use the summary above for the numbers."></canvas>
      <div id="tooltip" role="tooltip"></div>
    </div>
    <div class="hint">
      Scroll to zoom (cursor-anchored), drag to pan, click a marker for detail.
      From the keyboard: <kbd>←</kbd> <kbd>→</kbd> pan, <kbd>+</kbd> <kbd>−</kbd> zoom,
      <kbd>Home</kbd> back to now, <kbd>r</kbd> reload.
      Data loads only when you change the view — no auto-refresh.
    </div>
    <div id="detailPanel"></div>
  </div>

  <script src="/dom-utils.js"></script>
  <script src="/page-chrome.js"></script>
  <script src="/activity-periods.js"></script>
  <script src="/firebase-status-banner.js"></script>
  <script>
    'use strict';

    const canvas = document.getElementById('chart');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('tooltip');
    const statusText = document.getElementById('statusText');
    const detailPanel = document.getElementById('detailPanel');

    window.PageChrome.setSocketAbsent(
      'Activity fetches events when you change the view and never on a timer — ' +
      'a polling tab is itself the thing that keeps the instance awake.'
    );

    const COLORS = {
      active: '#4CAF50',
      idle: '#e2a63d',
      boot: '#56B4E9',
      shutdown: '#D55E00',
      woke: '#4CAF50',
      'went-idle': '#e2a63d',
      suspended: '#c792ea',
    };

    // A marker is a SHAPE first. Five colours on five identical dots is a
    // conjunction search where a pop-out was available, and it is not
    // colour-vision-safe (01-RESEARCH #17, #10). Colour still reinforces.
    const MARKS = {
      boot: 'triangle-up',
      shutdown: 'triangle-down',
      woke: 'circle',
      'went-idle': 'square',
      suspended: 'diamond',
    };
    const MARK_GLYPH = {
      boot: '▲', shutdown: '▼', woke: '●', 'went-idle': '■', suspended: '◆',
    };

    // View window (epoch ms). Start with the last 7 days.
    let viewEnd = Date.now();
    let viewStart = viewEnd - 7 * 24 * 3600 * 1000;

    // Loaded data covering [loadedStart, loadedEnd].
    let events = [];
    let periods = [];
    let loadedStart = 0, loadedEnd = 0, serverNow = Date.now(), truncated = false;
    let markerHits = [];  // {x, y, r, event}

    const MIN_RANGE_MS = 30 * 1000;
    const MAX_RANGE_MS = 400 * 24 * 3600 * 1000;

    function fmtTs(ms) {
      const d = new Date(ms);
      return d.toLocaleString(undefined, {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
      });
    }

    // Coarse whole-unit s/m/h/d duration for timeline labels — deliberately
    // NOT the millisecond-precision fmtDur from dom-utils.js.
    function fmtDurCoarse(ms) {
      if (ms < 0) ms = 0;
      const s = Math.round(ms / 1000);
      if (s < 60) return s + 's';
      const m = Math.floor(s / 60);
      if (m < 60) return m + 'm ' + (s % 60) + 's';
      const h = Math.floor(m / 60);
      if (h < 24) return h + 'h ' + (m % 60) + 'm';
      const d = Math.floor(h / 24);
      return d + 'd ' + (h % 24) + 'h';
    }
    const pct = (x) => Math.round(x * 100) + '%';

    // ---- Data loading (only on explicit user actions / view changes) ----

    let loadTimer = null;
    function scheduleLoadIfNeeded() {
      if (viewStart >= loadedStart && viewEnd <= loadedEnd && !truncated) return;
      clearTimeout(loadTimer);
      loadTimer = setTimeout(() => loadEvents(), 250);
    }

    async function loadEvents() {
      const margin = Math.max((viewEnd - viewStart) * 2, 24 * 3600 * 1000);
      const start = viewStart - margin;
      const end = viewEnd + margin;
      statusText.textContent = 'Loading…';
      try {
        const resp = await fetch(`/api/activity/events?start=${Math.round(start)}&end=${Math.round(end)}`);
        const data = await resp.json();
        events = data.events || [];
        truncated = !!data.truncated;
        serverNow = data.serverNow || Date.now();
        loadedStart = start;
        loadedEnd = end;
        buildPeriods();
        statusText.textContent = `${events.length} events` +
          (truncated ? ' · truncated, zoom in for full detail' : '');
      } catch (err) {
        console.error('Failed to load timeline events:', err);
        statusText.textContent = 'Failed to load events';
      }
      draw();
    }

    // ---- Period/segment reconstruction from raw events ----
    // Shared with the unit-tested module: src/web/activity-periods.js.
    function buildPeriods() {
      periods = ActivityPeriods.buildPeriods(events, serverNow);
    }

    // ---- The reading, stated ----

    function stat(cls, k, v, n, share) {
      return `<div class="stat ${cls}">
        <div class="k">${escapeHtml(k)}</div>
        <div class="v">${escapeHtml(v)}</div>
        ${n ? `<div class="n">${escapeHtml(n)}</div>` : ''}
        ${share || ''}
      </div>`;
    }

    function renderSummary() {
      const s = ActivityPeriods.summarize(periods, events, viewStart, viewEnd);
      const el = document.getElementById('summary');
      const bad = s.crashes + s.silentKills + s.unknownEnds;
      const endBits = [];
      if (s.graceful) endBits.push(s.graceful + ' clean');
      if (s.crashes) endBits.push(s.crashes + ' crash' + (s.crashes === 1 ? '' : 'es'));
      if (s.silentKills) endBits.push(s.silentKills + ' silent kill' + (s.silentKills === 1 ? '' : 's'));
      if (s.unknownEnds) endBits.push(s.unknownEnds + ' unexplained');
      if (s.openEnded) endBits.push('still up');

      el.innerHTML =
        stat('', 'window', fmtDurCoarse(s.span),
          'ending ' + fmtAgo(s.to) + ' — ' + new Date(s.from).toLocaleDateString() +
          ' → ' + new Date(s.to).toLocaleDateString()) +
        stat('', 'process up', fmtDurCoarse(s.up),
          pct(s.upShareOfWindow) + ' of the window · ' + fmtDurCoarse(s.dead) + ' scaled to zero',
          `<div class="share" title="active vs idle, within the time the process was up">
             <i style="width:${(s.up ? s.active / s.up : 0) * 100}%;background:${COLORS.active}"></i>
             <i style="width:${(s.up ? s.idle / s.up : 0) * 100}%;background:${COLORS.idle}"></i>
           </div>`) +
        stat('', 'active', fmtDurCoarse(s.active),
          'user actions or game traffic') +
        stat(s.idleShareOfUp > 0.5 ? 'warn' : '', 'up but idle', fmtDurCoarse(s.idle),
          pct(s.idleShareOfUp) + ' of uptime — billed, doing nothing') +
        stat(bad ? 'bad' : '', 'lifetimes', String(s.boots),
          endBits.length ? endBits.join(' · ') : 'no boot in this window');
    }

    // ---- Rendering ----

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function xForTs(ts, w) { return ((ts - viewStart) / (viewEnd - viewStart)) * w; }
    function tsForX(x, w) { return viewStart + (x / w) * (viewEnd - viewStart); }

    function niceTickStep(rangeMs, targetTicks) {
      const raw = rangeMs / targetTicks;
      const steps = [
        1000, 5000, 15000, 30000, 60000, 5 * 60000, 15 * 60000, 30 * 60000,
        3600000, 3 * 3600000, 6 * 3600000, 12 * 3600000,
        86400000, 2 * 86400000, 7 * 86400000, 30 * 86400000,
      ];
      for (const s of steps) if (s >= raw) return s;
      return steps[steps.length - 1];
    }

    function tickLabel(ts, stepMs) {
      const d = new Date(ts);
      if (stepMs >= 86400000) return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      if (stepMs >= 3600000) return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      if (stepMs >= 60000) return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
      return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    /** One marker, by shape. `size` is the half-extent. */
    function drawMark(kind, x, y, size, fill) {
      ctx.fillStyle = fill;
      ctx.beginPath();
      switch (kind) {
        case 'triangle-up':
          ctx.moveTo(x, y - size); ctx.lineTo(x + size, y + size * 0.8);
          ctx.lineTo(x - size, y + size * 0.8); break;
        case 'triangle-down':
          ctx.moveTo(x, y + size); ctx.lineTo(x + size, y - size * 0.8);
          ctx.lineTo(x - size, y - size * 0.8); break;
        case 'square':
          ctx.rect(x - size * 0.85, y - size * 0.85, size * 1.7, size * 1.7); break;
        case 'diamond':
          ctx.moveTo(x, y - size); ctx.lineTo(x + size, y);
          ctx.lineTo(x, y + size); ctx.lineTo(x - size, y); break;
        default:
          ctx.arc(x, y, size * 0.85, 0, Math.PI * 2);
      }
      ctx.closePath();
      ctx.fill();
      // A thin dark rim keeps a marker legible where it overlaps a band.
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    /** The legend, on the canvas, at a size where a hatch and a dashed box
     *  actually read — as 14x10px HTML swatches they did not (F4). */
    function drawLegend(w, y) {
      const items = [
        { kind: 'band', color: COLORS.active, label: 'active' },
        { kind: 'band', color: COLORS.idle, label: 'up but idle (billed)' },
        { kind: 'hatch', label: 'end bounded by last heartbeat' },
        { kind: 'dead', label: 'scaled to zero' },
        { kind: 'mark', mark: MARKS.boot, color: COLORS.boot, label: 'boot' },
        { kind: 'mark', mark: MARKS.shutdown, color: COLORS.shutdown, label: 'shutdown' },
        { kind: 'mark', mark: MARKS.woke, color: COLORS.woke, label: 'woke' },
        { kind: 'mark', mark: MARKS['went-idle'], color: COLORS['went-idle'], label: 'went idle' },
        { kind: 'mark', mark: MARKS.suspended, color: COLORS.suspended, label: 'suspended' },
      ];
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      let x = 2;
      for (const it of items) {
        if (it.kind === 'band') {
          ctx.fillStyle = it.color;
          ctx.fillRect(x, y - 5, 16, 10);
        } else if (it.kind === 'hatch') {
          ctx.fillStyle = '#555';
          ctx.fillRect(x, y - 5, 16, 10);
          drawHatch(x, y - 5, 16, 10);
        } else if (it.kind === 'dead') {
          ctx.strokeStyle = '#666';
          ctx.setLineDash([3, 3]);
          ctx.strokeRect(x + 0.5, y - 4.5, 15, 9);
          ctx.setLineDash([]);
        } else {
          drawMark(it.mark, x + 8, y, 5, it.color);
        }
        ctx.fillStyle = '#9a9a9a';
        ctx.fillText(it.label, x + 21, y + 0.5);
        x += 21 + ctx.measureText(it.label).width + 16;
        if (x > w - 60) break;
      }
      ctx.textBaseline = 'alphabetic';
    }

    /**
     * The one place the chart's vertical geometry is decided, so the drawing
     * and the hit-testing cannot drift apart. The band FILLS the canvas
     * rather than sitting as a fixed 168 px strip inside it — the chart is
     * sized to the viewport now, and a fixed band would only have added empty
     * canvas beneath it (04-SECONDARY-SCREENS F4). The top 92 px belong to the
     * legend and the marker stems; the bottom 24 to the time axis.
     */
    function bandGeom(h) {
      const axisY = h - 24;
      const top = 92;
      return { top, height: Math.max(120, axisY - top - 10), axisY };
    }

    function draw() {
      resizeCanvas();
      const rect = canvas.getBoundingClientRect();
      const w = rect.width, h = rect.height;
      ctx.clearRect(0, 0, w, h);
      markerHits = [];

      const { top: bandTop, height: bandH, axisY } = bandGeom(h);

      // Grid / time axis
      const stepMs = niceTickStep(viewEnd - viewStart, Math.max(3, Math.floor(w / 140)));
      const firstTick = Math.ceil(viewStart / stepMs) * stepMs;
      ctx.strokeStyle = '#333';
      ctx.fillStyle = '#888';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      for (let t = firstTick; t <= viewEnd; t += stepMs) {
        const x = xForTs(t, w);
        ctx.beginPath(); ctx.moveTo(x, 46); ctx.lineTo(x, axisY); ctx.stroke();
        ctx.fillText(tickLabel(t, stepMs), x, axisY + 15);
      }

      // Activity bands
      for (const p of periods) {
        const drawEnd = p.deadUntil != null ? p.deadUntil : p.end;
        if (drawEnd < viewStart || p.start > viewEnd) continue;
        for (const seg of p.segments) {
          const x1 = Math.max(0, xForTs(seg.start, w));
          const x2 = Math.min(w, xForTs(seg.end, w));
          if (x2 <= x1) continue;
          ctx.fillStyle = seg.state === 'active' ? COLORS.active : COLORS.idle;
          ctx.fillRect(x1, bandTop, Math.max(x2 - x1, 1), bandH);
        }
        if (!p.endKnown) {
          const x2 = Math.min(w, xForTs(p.end, w));
          const hatchW = Math.min(18, Math.max(6, w * 0.01));
          const x1 = Math.max(0, x2 - hatchW);
          drawHatch(x1, bandTop, x2 - x1, bandH);
          ctx.strokeStyle = '#bbb';
          ctx.setLineDash([3, 3]);
          ctx.beginPath(); ctx.moveTo(x2, bandTop); ctx.lineTo(x2, bandTop + bandH); ctx.stroke();
          ctx.setLineDash([]);
          if (p.deadUntil != null && p.deadUntil > p.end) {
            const gx1 = Math.max(0, x2);
            const gx2 = Math.min(w, xForTs(p.deadUntil, w));
            if (gx2 > gx1 + 1) {
              ctx.strokeStyle = '#666';
              ctx.setLineDash([4, 4]);
              ctx.strokeRect(gx1 + 1, bandTop + 1, gx2 - gx1 - 2, bandH - 2);
              ctx.setLineDash([]);
            }
          }
        }
        if (p.openEnded) {
          const x2 = Math.min(w, xForTs(p.end, w));
          const grad = ctx.createLinearGradient(x2 - 14, 0, x2, 0);
          grad.addColorStop(0, 'rgba(34,34,34,0)');
          grad.addColorStop(1, 'rgba(34,34,34,0.85)');
          ctx.fillStyle = grad;
          ctx.fillRect(x2 - 14, bandTop, 14, bandH);
        }
      }

      // Event markers. Lifecycle (boot/shutdown) sits on the lower rank so it
      // never collides with the wake/idle transitions above it.
      const markerY = bandTop - 16;
      for (const ev of events) {
        if (ev.ts < viewStart || ev.ts > viewEnd) continue;
        const x = xForTs(ev.ts, w);
        const color = COLORS[ev.type] || '#aaa';
        const isLifecycle = ev.type === 'boot' || ev.type === 'shutdown';
        const y = isLifecycle ? markerY : markerY - 15;
        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.45;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, y + 6); ctx.lineTo(x, bandTop + bandH); ctx.stroke();
        ctx.globalAlpha = 1;
        drawMark(MARKS[ev.type] || 'circle', x, y, 5.5, color);
        markerHits.push({ x, y, r: 8, event: ev });
      }

      drawLegend(w, 16);

      ctx.fillStyle = '#777';
      ctx.textAlign = 'left';
      ctx.font = '11px sans-serif';
      ctx.fillText(
        `${fmtTs(viewStart)}  →  ${fmtTs(viewEnd)}  (${fmtDurCoarse(viewEnd - viewStart)})`,
        2, 40
      );
      renderSummary();
    }

    function drawHatch(x, y, w, h) {
      ctx.save();
      ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
      ctx.strokeStyle = 'rgba(0,0,0,0.45)';
      ctx.lineWidth = 2;
      for (let i = -h; i < w; i += 6) {
        ctx.beginPath();
        ctx.moveTo(x + i, y + h);
        ctx.lineTo(x + i + h, y);
        ctx.stroke();
      }
      ctx.restore();
    }

    // ---- Interaction: zoom, pan, hover/click — pointer AND keyboard ----

    function zoomBy(factor, anchorFrac) {
      let range = (viewEnd - viewStart) * factor;
      range = Math.min(Math.max(range, MIN_RANGE_MS), MAX_RANGE_MS);
      const anchor = viewStart + (viewEnd - viewStart) * anchorFrac;
      viewStart = anchor - range * anchorFrac;
      viewEnd = viewStart + range;
      draw();
      scheduleLoadIfNeeded();
    }
    function panBy(fraction) {
      const dt = (viewEnd - viewStart) * fraction;
      viewStart += dt; viewEnd += dt;
      draw();
      scheduleLoadIfNeeded();
    }

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      zoomBy(Math.exp(e.deltaY * 0.0015), (e.clientX - rect.left) / rect.width);
    }, { passive: false });

    // The chart is the page's only real interaction; before this it was
    // reachable with a mouse and by no other means (F4).
    canvas.addEventListener('keydown', (e) => {
      let handled = true;
      if (e.key === 'ArrowLeft') panBy(-0.15);
      else if (e.key === 'ArrowRight') panBy(0.15);
      else if (e.key === '+' || e.key === '=') zoomBy(1 / 1.6, 0.5);
      else if (e.key === '-' || e.key === '_') zoomBy(1.6, 0.5);
      else if (e.key === 'Home') {
        const range = viewEnd - viewStart;
        viewEnd = Date.now(); viewStart = viewEnd - range;
        draw(); scheduleLoadIfNeeded();
      } else handled = false;
      if (handled) e.preventDefault();
    });

    let dragging = false, dragX = 0, dragMoved = false;
    canvas.addEventListener('pointerdown', (e) => {
      dragging = true; dragMoved = false; dragX = e.clientX;
      canvas.classList.add('dragging');
      canvas.setPointerCapture(e.pointerId);
      canvas.focus();
    });
    canvas.addEventListener('pointermove', (e) => {
      const rect = canvas.getBoundingClientRect();
      if (dragging) {
        const dx = e.clientX - dragX;
        if (Math.abs(dx) > 2) dragMoved = true;
        dragX = e.clientX;
        const dt = (dx / rect.width) * (viewEnd - viewStart);
        viewStart -= dt; viewEnd -= dt;
        draw();
        scheduleLoadIfNeeded();
        tooltip.style.display = 'none';
        return;
      }
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const hit = hitTest(mx, my);
      if (hit) {
        tooltip.style.display = 'block';
        tooltip.textContent = markerText(hit.event);
        positionTooltip(e.clientX, e.clientY);
      } else {
        const seg = segmentAt(tsForX(mx, rect.width), my);
        if (seg) {
          tooltip.style.display = 'block';
          tooltip.textContent = segText(seg);
          positionTooltip(e.clientX, e.clientY);
        } else {
          tooltip.style.display = 'none';
        }
      }
    });
    canvas.addEventListener('pointerup', (e) => {
      canvas.classList.remove('dragging');
      if (dragging && !dragMoved) {
        const rect = canvas.getBoundingClientRect();
        const hit = hitTest(e.clientX - rect.left, e.clientY - rect.top);
        showDetail(hit ? hit.event : null);
      }
      dragging = false;
    });
    canvas.addEventListener('pointerleave', () => { tooltip.style.display = 'none'; });

    // Viewport coordinates: the tooltip is position:fixed so it can leave the
    // chart's box instead of being clipped by it.
    function positionTooltip(clientX, clientY) {
      const t = tooltip.getBoundingClientRect();
      let left = clientX + 16, top = clientY + 16;
      if (left + t.width > window.innerWidth - 8) left = clientX - t.width - 16;
      if (top + t.height > window.innerHeight - 8) top = clientY - t.height - 16;
      tooltip.style.left = Math.max(8, left) + 'px';
      tooltip.style.top = Math.max(8, top) + 'px';
    }

    function hitTest(mx, my) {
      let best = null, bestD = Infinity;
      for (const m of markerHits) {
        const d = Math.hypot(m.x - mx, m.y - my);
        if (d <= m.r + 3 && d < bestD) { best = m; bestD = d; }
      }
      return best;
    }

    function segmentAt(ts, my) {
      const g = bandGeom(canvas.getBoundingClientRect().height);
      if (my < g.top || my > g.top + g.height) return null;
      for (const p of periods) {
        if (!p.endKnown && p.deadUntil != null && ts > p.end && ts <= p.deadUntil) {
          return { deadGap: true, start: p.end, end: p.deadUntil, period: p };
        }
        if (ts < p.start || ts > p.end) continue;
        for (const seg of p.segments) {
          if (ts >= seg.start && ts <= seg.end) return { ...seg, period: p };
        }
      }
      return null;
    }

    function markerText(ev) {
      let txt = `${MARK_GLYPH[ev.type] || '•'} ${ev.type}  —  ${fmtTs(ev.ts)}`;
      if (ev.detail) {
        for (const [k, v] of Object.entries(ev.detail)) {
          txt += `\n${k}: ${typeof v === 'object' ? JSON.stringify(v) : v}`;
        }
      }
      return txt;
    }

    function segText(seg) {
      if (seg.deadGap) {
        const cls = seg.period && seg.period.endClass;
        let t = 'Scaled to zero (process dead)\n' + fmtTs(seg.start) + ' → ' + fmtTs(seg.end) +
          '\nDuration: ' + fmtDurCoarse(seg.end - seg.start) +
          '\nNo process was running here — nothing billed.';
        t += cls === 'crash'
          ? '\nPrevious lifetime ended by crash (died with recent activity).'
          : '\nPrevious lifetime ended by silent kill (autoscale scaled to zero after idling).';
        return t;
      }
      const label = seg.state === 'active' ? 'Active (users/games)' : 'Up but idle';
      let txt = `${label}\n${fmtTs(seg.start)} → ${fmtTs(seg.end)}\nDuration: ${fmtDurCoarse(seg.end - seg.start)}`;
      if (seg.period && !seg.period.endKnown) {
        const cls = seg.period.endClass;
        if (cls === 'silent-kill') {
          txt += '\n⚠ Ended by silent kill: platform scaled to zero (idle at last heartbeat).';
          txt += '\nEnd bounded by last liveness heartbeat (±~1–2 min); the gap after it until the next boot is scaled-to-zero, not billed idle.';
        } else if (cls === 'crash') {
          txt += '\n⚠ Ended by crash: process died with recent activity (no shutdown event).';
          txt += '\nEnd bounded by last liveness heartbeat (±~1–2 min).';
        } else {
          txt += '\n⚠ Period end unknown (no shutdown event and no heartbeat data — closed by next boot)';
        }
      }
      if (seg.period && seg.period.endKnown && seg.period.endClass === 'crash') {
        txt += '\n⚠ Ended by a caught fatal error (uncaughtException / unhandledRejection) — see the shutdown marker for the cause.';
      }
      if (seg.period && seg.period.openEnded) txt += '\nServer still up (period open)';
      return txt;
    }

    function showDetail(ev) {
      if (!ev) { detailPanel.style.display = 'none'; return; }
      detailPanel.style.display = 'block';
      const detailJson = ev.detail ? JSON.stringify(ev.detail, null, 2) : '(none)';
      detailPanel.innerHTML =
        `<h3>${escapeHtml(MARK_GLYPH[ev.type] || '•')} ${escapeHtml(ev.type)} event</h3>` +
        `<div>Time: ${escapeHtml(fmtTs(ev.ts))} (${escapeHtml(String(ev.ts))} ms)</div>` +
        `<div>Event id: ${escapeHtml(String(ev.id))}</div>` +
        `<pre>${escapeHtml(detailJson)}</pre>`;
    }

    // ---- Toolbar ----

    function applyRange(btn) {
      document.querySelectorAll('.toolbar button[data-range]').forEach(b => {
        b.classList.remove('active');
        b.removeAttribute('aria-pressed');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      viewEnd = Date.now();
      viewStart = viewEnd - Number(btn.dataset.range);
    }

    document.querySelectorAll('.toolbar button[data-range]').forEach(btn => {
      btn.addEventListener('click', () => { applyRange(btn); loadEvents(); });
    });
    document.getElementById('refreshBtn').addEventListener('click', () => loadEvents());
    window.PageChrome.key((e) => e.key === 'r', () => loadEvents(), ['r', 'reload this window']);

    window.addEventListener('resize', draw);

    // Optional #1h / #6h / #24h / #3d / #7d / #30d hash picks the initial range.
    (function applyHashRange() {
      const label = (location.hash || '').replace('#', '');
      const btn = Array.from(document.querySelectorAll('.toolbar button[data-range]'))
        .find(b => b.textContent === label);
      if (btn) applyRange(btn);
    })();

    // Initial load — one fetch, no timers after that.
    loadEvents();
  </script>
</body>
</html>
